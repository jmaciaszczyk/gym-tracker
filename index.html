<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e23">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="barlow-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Barlow Condensed SemiBold, SIL Open Font License, vendored from Google Fonts so it works offline */
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url(barlow-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url(barlow-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }

:root {
  color-scheme: light dark;
  --paper: #f2f3f5; --surface: #ffffff; --ink: #23272e; --muted: #5e6570; --line: #d5d9df; --field: #80868f;
  --accent: #1e56c8; --on-accent: #ffffff; --danger: #b3261e; --on-danger: #ffffff; --warn: #fff1c7;
  /* competition plate colours: each training day of a plan gets one, in order */
  --plate-0: #d3262d; --plate-1: #1e56c8; --plate-2: #e8ae0c; --plate-3: #1e8c4e; --plate-4: #c3c9d1;
  --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1b1e23; --surface: #252930; --ink: #e8eaed; --muted: #9ea5af; --line: #3a3f47; --field: #737a85;
    --accent: #7ea6ff; --on-accent: #0f1a33; --danger: #ff8a80; --on-danger: #2b0a08; --warn: #3d3315;
    --plate-4: #e8eaed;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: calc(150px + env(safe-area-inset-bottom)); }   /* keep focused fields clear of the tab bar / rest + Finish bar */
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 12px 16px calc(96px + env(safe-area-inset-bottom)); }
h1, h2, h3, .num, .tile-name, .delta { font-family: var(--display); font-weight: 600; }
h1 { font-size: 2.4rem; line-height: 1.05; margin: 8px 0 16px; }
h2 { font-size: 1.45rem; line-height: 1.15; margin: 0; }
p { margin: 0 0 12px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.empty { color: var(--muted); max-width: 32em; }
.err { color: var(--danger); font-size: .92rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

button, .btn {
  font: inherit; min-height: 48px; padding: 0 18px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; text-decoration: none; touch-action: manipulation;
}
button:disabled { opacity: .4; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.danger { color: var(--danger); }
.danger-fill { background: var(--danger); border-color: var(--danger); color: var(--on-danger); font-weight: 600; }
.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
.icon { width: 44px; min-height: 44px; padding: 0; flex: none; font-size: 1.1rem; }
.file:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.actions.col { flex-direction: column; }

input, select {
  font: inherit; font-size: 18px; min-height: 48px; width: 100%; padding: 0 12px; border: 1px solid var(--field); border-radius: 8px;
  background: var(--surface); color: var(--ink);
}
input::placeholder { color: var(--muted); opacity: 1; }
input[type=radio] { width: 22px; min-height: 22px; margin: 0; accent-color: var(--accent); }
.sets input.filled { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
input[aria-invalid=true] { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
label { display: block; color: var(--muted); font-size: .92rem; }
label > input, label > select { margin-top: 4px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

/* top bar of sub-screens */
.bar { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.bar a { min-height: 48px; display: inline-flex; align-items: center; font-weight: 600; text-decoration: none; }

/* bottom navigation */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabs a {
  min-height: 56px; display: flex; align-items: center; justify-content: center; border-top: 3px solid transparent;
  font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--muted); text-decoration: none;
}
.tabs a[aria-current=page] { color: var(--ink); border-top-color: var(--accent); }

.banner { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; background: var(--danger); color: var(--on-danger); font-weight: 600; }
.banner button { min-height: 40px; }
.notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 14px; margin: 0 0 12px;
  border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.notice.warn { background: var(--warn); border-color: transparent; }
.fatal { max-width: 32rem; margin: 15vh auto; padding: 0 16px; }

/* Train: one section per plan, each day a plate-coloured tile */
.plan { margin: 0 0 28px; }
.plan-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.tile {
  width: 100%; min-height: 76px; margin: 0 0 10px; padding: 10px 16px; flex-direction: column; align-items: flex-start;
  border-left: 14px solid var(--plate); border-radius: 12px; text-align: left;
}
.tile-name { font-size: 1.75rem; line-height: 1.05; }
.tile small { color: var(--muted); font-size: .92rem; }

/* plan editor */
.title-input { font-family: var(--display); font-weight: 600; font-size: 2rem; padding: 0; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent; }
.title-input:focus { border-bottom-color: var(--accent); outline: none; }
.day { margin: 24px 0; padding: 4px 0 8px 12px; border-left: 6px solid var(--plate); }
.day-head { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
.day-head input { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.exrow { padding: 8px 0; border-bottom: 1px solid var(--line); }
.exname { width: 100%; min-height: 44px; padding: 0; border: 0; background: none; justify-content: space-between; text-align: left; font-weight: 600; }
.exname span { color: var(--muted); }
.l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.moves { display: flex; gap: 4px; margin-left: auto; }   /* wraps under the stepper on 320px phones */
.stepper { display: flex; align-items: center; }
.stepper output { min-width: 4.2rem; text-align: center; font-family: var(--display); font-weight: 600; font-size: 1.25rem; }
.add { margin-top: 10px; width: 100%; border-style: dashed; }

/* logger and workout view */
.log-head { border-left: 14px solid var(--plate); padding-left: 12px; margin: 4px 0 16px; }
.log-head h1 { margin: 0; }
.log-head p { margin: 0; }
.exercise { padding: 16px 0 8px; border-top: 1px solid var(--line); }
.last { color: var(--muted); font-size: .95rem; margin: 2px 0 8px; }
.sets { width: 100%; border-collapse: collapse; table-layout: fixed; }
.sets .c-set { width: 13%; } .sets .c-prev { width: 33%; }
.sets th { font-weight: 400; font-size: .85rem; color: var(--muted); text-align: left; padding: 0 4px 2px; }
.sets td { padding: 3px; }
.sets td.num { font-size: 1.45rem; color: var(--muted); text-align: center; }
.sets input { text-align: center; font-family: var(--display); font-weight: 600; font-size: 24px; padding: 0 4px; }
.prev { width: 100%; padding: 0 4px; border-style: dashed; border-color: var(--field); background: transparent; color: var(--muted);
  font-family: var(--display); font-weight: 600; font-size: 1.2rem; white-space: nowrap; overflow: hidden; }
.dash { display: block; text-align: center; color: var(--muted); }
.finish { position: sticky; bottom: 0; padding: 20px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--paper) 16px); }
.finish > button { width: 100%; font-size: 1.1rem; }
.rest { display: flex; gap: 8px; margin-bottom: 8px; }
.rest .step { width: 64px; flex: none; padding: 0; font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
.rest-main { flex: 1; min-width: 0; min-height: 56px; padding: 0 8px; flex-direction: column; gap: 0; line-height: 1.15; }
.rest .clock { font-family: var(--display); font-weight: 600; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.rest small { color: var(--muted); font-size: .9rem; }
.rest.running .rest-main { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.rest.running small { color: inherit; }
.rest.done .rest-main { background: var(--warn); border-color: var(--plate-2); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.list > li > a, .list > li > button {
  display: block; width: 100%; padding: 12px 0 12px 14px; border: 0; border-left: 6px solid var(--plate, var(--line)); border-bottom: 1px solid var(--line);
  border-radius: 0; background: none; color: inherit; text-decoration: none; text-align: left; min-height: 48px;
}
.list .row { display: flex; justify-content: space-between; gap: 12px; }
.list .line { display: block; color: var(--muted); font-size: .92rem; }
.section { margin: 28px 0; }
.section h2 { margin-bottom: 8px; }

/* body */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.grid2 .wide { grid-column: 1 / -1; }

/* progress */
.seg { display: flex; gap: 8px; margin: 12px 0 0; }
.seg label { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--surface); }
.seg label:has(:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.seg label:has(:disabled) { opacity: .4; }
.chart { margin: 20px 0 0; }
.delta { font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.chart circle { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.chart text { font: 11px system-ui, sans-serif; fill: var(--muted); }
details { margin: 16px 0; }
summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--accent); }
.data { width: 100%; border-collapse: collapse; }
.data th, .data td { text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 400; }
.data th { color: var(--muted); font-size: .85rem; }

/* dialogs */
dialog { color: var(--ink); background: var(--paper); border: 0; padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .5); }
.picker { width: 100%; max-width: 40rem; height: 100%; max-height: 100dvh; margin: 0 auto; }
.picker[open] { display: flex; flex-direction: column; }
.picker-head { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); padding-top: calc(12px + env(safe-area-inset-top)); }
.picker-list { overflow-y: auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); flex: 1; }
.picker-list h3 { font-size: 1.15rem; color: var(--muted); margin: 18px 0 2px; }
.picker-list .opt { width: 100%; justify-content: flex-start; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 0 2px; }
.create { display: flex; gap: 8px; margin-top: 12px; padding: 8px; border: 1px dashed var(--accent); border-radius: 12px; }
.create button { flex: 1; min-width: 0; justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.create select { width: auto; flex: none; }
.confirm { width: calc(100% - 32px); max-width: 30rem; padding: 20px; border-radius: 14px; }
.confirm h2 { margin-bottom: 12px; }
@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: rise .16s ease-out; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
